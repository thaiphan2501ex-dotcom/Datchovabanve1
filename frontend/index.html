<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đặt Vé Sự Kiện</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans pb-32">
    <!-- Thanh điều hướng (Navbar) -->
    <nav class="bg-blue-900 text-white p-4 shadow-md fixed top-0 w-full z-50 flex justify-between items-center px-10">
        <h1 class="text-2xl font-extrabold cursor-pointer tracking-wider" onclick="switchView('home')">🎟️ TICKET<span class="text-yellow-400">PRO</span></h1>
        <div class="space-x-6 font-semibold">
            <button onclick="switchView('home')" class="hover:text-yellow-400 transition">Khám phá sự kiện</button>
            <button onclick="switchView('admin')" class="bg-red-600 px-4 py-2 rounded-lg hover:bg-red-700 shadow border border-red-500 transition">⚙️ Quản trị viên</button>
        </div>
    </nav>

    <div class="pt-24">
        <!-- ================= MÀN HÌNH 1: TRANG CHỦ ================= -->
        <div id="view-home" class="max-w-6xl mx-auto p-4">
            <h2 class="text-3xl font-bold text-gray-800 mb-8 border-l-4 border-blue-600 pl-4">Sự kiện đang bùng nổ</h2>
            <div id="event-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-gray-500 animate-pulse col-span-full text-center">⏳ Đang tải danh sách sự kiện...</p>
            </div>
        </div>

        <!-- ================= MÀN HÌNH 2: TẠO SỰ KIỆN (ADMIN) ================= -->
        <div id="view-admin" class="max-w-2xl mx-auto p-8 bg-white rounded-xl shadow-lg hidden border-t-4 border-red-600">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Tạo Sự Kiện Mới</h2>
            <form id="form-create-event" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Tên sự kiện</label>
                    <input type="text" id="ev-title" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="VD: Liveshow Rap Việt">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Mô tả</label>
                    <textarea id="ev-desc" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Địa điểm</label>
                    <input type="text" id="ev-loc" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="VD: Sân vận động Trà Vinh">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Bắt đầu</label>
                        <input type="datetime-local" id="ev-start" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Kết thúc</label>
                        <input type="datetime-local" id="ev-end" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>
                <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition mt-4 shadow-lg text-lg">
                    🚀 Tạo sự kiện & Sinh tự động 50 ghế
                </button>
                <p id="admin-msg" class="text-center font-bold mt-4"></p>
            </form>
        </div>

        <!-- ================= MÀN HÌNH 3: SƠ ĐỒ CHỌN GHẾ ================= -->
        <div id="view-booking" class="max-w-4xl mx-auto p-8 bg-white rounded-xl shadow-lg hidden">
            <button onclick="switchView('home')" class="mb-4 text-blue-600 font-bold hover:underline">← Quay lại trang chủ</button>
            <div id="event-info" class="mb-6 pb-6 border-b border-gray-200"></div>

            <div class="flex flex-wrap gap-4 justify-center mb-8 text-sm font-medium">
                <div class="flex items-center gap-2"><span class="w-6 h-6 rounded bg-purple-100 border-2 border-purple-500"></span> VIP (1.000.000đ)</div>
                <div class="flex items-center gap-2"><span class="w-6 h-6 rounded bg-green-100 border-2 border-green-500"></span> Thường (500.000đ)</div>
                <div class="flex items-center gap-2"><span class="w-6 h-6 rounded bg-blue-500 border-2 border-blue-700"></span> Đang chọn</div>
                <div class="flex items-center gap-2"><span class="w-6 h-6 rounded bg-yellow-100 border-2 border-yellow-500"></span> Đang bị giữ</div>
                <div class="flex items-center gap-2"><span class="w-6 h-6 rounded bg-gray-200 border-2 border-gray-400"></span> Đã bán</div>
            </div>

            <div class="w-2/3 mx-auto bg-gray-800 text-white text-center py-2 rounded-t-3xl font-bold mb-10 shadow-md">SÂN KHẤU</div>

            <div id="seat-map" class="grid grid-cols-10 gap-3 relative"></div>
            <div id="booking-message" class="mt-6 text-center font-bold"></div>
        </div>
    </div>

    <!-- Thanh công cụ (Giỏ hàng) -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 flex justify-between items-center px-10 hidden z-50">
        <div>
            <p class="text-gray-600">Ghế đang chọn: <span id="selected-seats-list" class="font-bold text-blue-600">Chưa chọn</span></p>
            <p class="text-lg font-bold text-gray-800">Tổng tiền: <span id="total-price" class="text-red-500">0 đ</span></p>
        </div>
        <button id="btn-confirm" onclick="confirmBooking()" disabled class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold text-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
            Giữ chỗ ngay
        </button>
    </div>

    <script>
        let currentEventId = null;
        let selectedSeats = [];
        let allSeatsData = [];

        function switchView(viewName) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-admin').classList.add('hidden');
            document.getElementById('view-booking').classList.add('hidden');
            document.getElementById('cart-bar').classList.add('hidden');

            if (viewName === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                loadEvents();
            } else if (viewName === 'admin') {
                document.getElementById('view-admin').classList.remove('hidden');
            } else if (viewName === 'booking') {
                document.getElementById('view-booking').classList.remove('hidden');
                document.getElementById('cart-bar').classList.remove('hidden');
            }
        }

        function loadEvents() {
            fetch('http://localhost:5000/api/v1/events')
                .then(res => res.json())
                .then(events => {
                    const list = document.getElementById('event-list');
                    if (events.length === 0) {
                        list.innerHTML = '<p class="col-span-full text-center text-red-500 font-bold">Chưa có sự kiện nào. Hãy vào Admin để tạo!</p>';
                        return;
                    }
                    list.innerHTML = '';
                    events.forEach(ev => {
                        list.innerHTML += `
                            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow border border-gray-100 flex flex-col">
                                <div class="h-40 bg-gradient-to-r from-blue-500 to-indigo-600 flex items-center justify-center p-4">
                                    <h3 class="text-white text-2xl font-black text-center drop-shadow-md">${ev.title}</h3>
                                </div>
                                <div class="p-5 flex-1 flex flex-col justify-between">
                                    <div>
                                        <p class="text-gray-600 mb-2">📍 <b>${ev.location}</b></p>
                                        <p class="text-gray-600 mb-4">🕒 ${new Date(ev.start_time).toLocaleString('vi-VN')}</p>
                                    </div>
                                    <button onclick="openBooking(${ev.id}, '${ev.title}', '${ev.location}', '${ev.start_time}')" class="w-full bg-blue-100 text-blue-700 font-bold py-2 rounded hover:bg-blue-600 hover:text-white transition">
                                        Mua vé ngay →
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                });
        }

        function openBooking(id, title, loc, time) {
            currentEventId = id;
            selectedSeats = [];
            
            document.getElementById('event-info').innerHTML = `
                <h1 class="text-3xl font-extrabold text-blue-700">${title}</h1>
                <p class="text-gray-600 mt-2">📍 ${loc} | 🕒 ${new Date(time).toLocaleString('vi-VN')}</p>
            `;
            
            loadSeats(currentEventId);
            switchView('booking');
        }

        document.getElementById('form-create-event').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('admin-msg');
            msg.textContent = '⏳ Đang tạo sự kiện và sinh 50 ghế...';
            msg.className = 'text-center font-bold mt-4 text-blue-500';

            const bodyData = {
                title: document.getElementById('ev-title').value,
                description: document.getElementById('ev-desc').value,
                location: document.getElementById('ev-loc').value,
                start_time: document.getElementById('ev-start').value.replace('T', ' ') + ':00',
                end_time: document.getElementById('ev-end').value.replace('T', ' ') + ':00'
            };

            try {
                const res = await fetch('http://localhost:5000/api/v1/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();
                if (res.ok) {
                    msg.textContent = '✅ ' + data.message;
                    msg.className = 'text-center font-bold mt-4 text-green-600';
                    document.getElementById('form-create-event').reset();
                    setTimeout(() => switchView('home'), 1500);
                } else {
                    msg.textContent = '❌ Lỗi: ' + data.error;
                    msg.className = 'text-center font-bold mt-4 text-red-600';
                }
            } catch (err) {
                msg.textContent = '❌ Lỗi kết nối Server';
            }
        });

        function loadSeats(eventId) {
            fetch(`http://localhost:5000/api/v1/events/${eventId}/seats`)
                .then(res => res.json())
                .then(seats => {
                    allSeatsData = seats;
                    renderSeatMap();
                });
        }

        function renderSeatMap() {
            const map = document.getElementById('seat-map');
            map.innerHTML = ''; 
            allSeatsData.forEach(seat => {
                let colorClasses = '', disabledAttr = '';
                if (selectedSeats.includes(seat.seat_number)) {
                    colorClasses = 'bg-blue-500 border-blue-700 text-white hover:bg-blue-600 scale-105 shadow-md';
                } else if (seat.status === 'AVAILABLE') {
                    colorClasses = seat.tier === 'VIP' ? 'bg-purple-100 border-purple-500 text-purple-800 hover:bg-purple-200' : 'bg-green-100 border-green-500 text-green-800 hover:bg-green-200';
                } else if (seat.status === 'RESERVED') {
                    colorClasses = 'bg-yellow-100 border-yellow-500 text-yellow-800 opacity-80 cursor-not-allowed';
                    disabledAttr = 'disabled';
                } else {
                    colorClasses = 'bg-gray-200 border-gray-400 text-gray-500 opacity-60 cursor-not-allowed';
                    disabledAttr = 'disabled';
                }
                map.innerHTML += `<button ${disabledAttr} onclick="toggleSeat('${seat.seat_number}')" class="w-full aspect-square flex flex-col items-center justify-center border-2 rounded-lg font-bold transition-all ${colorClasses}"><span class="text-sm sm:text-base">${seat.seat_number}</span></button>`;
            });
            updateCartUI();
        }

        function toggleSeat(seatNumber) {
            const index = selectedSeats.indexOf(seatNumber);
            if (index > -1) selectedSeats.splice(index, 1);
            else {
                if (selectedSeats.length >= 4) return alert("Chỉ được mua tối đa 4 vé mỗi lần giao dịch!");
                selectedSeats.push(seatNumber);
            }
            renderSeatMap();
        }

        function updateCartUI() {
            const listEl = document.getElementById('selected-seats-list');
            const priceEl = document.getElementById('total-price');
            const btnConfirm = document.getElementById('btn-confirm');

            if (selectedSeats.length === 0) {
                listEl.textContent = 'Chưa chọn';
                priceEl.textContent = '0 đ';
                btnConfirm.disabled = true;
                return;
            }
            listEl.textContent = selectedSeats.join(', ');
            btnConfirm.disabled = false;

            let total = 0;
            selectedSeats.forEach(selectedNum => {
                const seatInfo = allSeatsData.find(s => s.seat_number === selectedNum);
                if (seatInfo) total += parseFloat(seatInfo.price);
            });
            priceEl.textContent = new Intl.NumberFormat('vi-VN').format(total) + ' đ';
        }

        async function confirmBooking() {
            const msgEl = document.getElementById('booking-message');
            msgEl.textContent = '⏳ Đang gửi yêu cầu giữ chỗ...';
            msgEl.className = 'mt-6 text-center text-lg font-bold text-blue-500 animate-pulse';

            let successCount = 0, failCount = 0;
            for (const seatNumber of selectedSeats) {
                try {
                    const res = await fetch('http://localhost:5000/api/v1/bookings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: 1, event_id: currentEventId, seat_number: seatNumber })
                    });
                    if (res.ok) successCount++; else failCount++;
                } catch (error) { failCount++; }
            }

            if (failCount === 0) {
                msgEl.innerHTML = `✅ Thành công! Đã giữ chỗ <b>${successCount} ghế</b>.`;
                msgEl.className = 'mt-6 text-center text-lg font-bold text-green-600';
            } else {
                msgEl.innerHTML = `⚠️ Lỗi xung đột: Có ${failCount} ghế vừa bị người khác giành mất (Mô phỏng 409).`;
                msgEl.className = 'mt-6 text-center text-lg font-bold text-red-600';
            }

            selectedSeats = [];
            loadSeats(currentEventId);
        }

        // Khởi động
        switchView('home');
    </script>
</body>
</html>
